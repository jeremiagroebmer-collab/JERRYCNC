return '<div class="topline"><div><div class="muted small">DEMO · NICHT FREIGEGEBEN</div><h1>'+DEMO+'</h1><p>Montageplatte MP-120 · TechMotion GmbH · 50 Stück</p></div><button class="secondary" data-nav="orders">Auftragsliste</button></div><div class="notice">Simulation: Der Auftrag ist nicht real. Zeichnung und Zeit-/Kostenwerte sind Testdaten. Keine Fertigungsfreigabe und kein versandfertiges Angebot.</div><div class="grid"><div class="card"><div class="muted small">Status</div><div class="metric">In Fertigung (Demo)</div></div><div class="card"><div class="muted small">Material</div><div class="metric">6082 T6</div></div><div class="card"><div class="muted small">Stückzahl</div><div class="metric">50</div></div><div class="card"><div class="muted small">Liefertermin</div><div class="metric">27.11.2026</div></div></div><div class="section card"><h2>Zeichnung · Revision A (schematisch)</h2>'+drawingDemo()+'<p class="muted small">Außenmaß 120 × 80 × 15 mm · Rohmaß 125 × 85 × 20 mm. Lochpositionen, Gewindetiefen und vollständige Toleranzen fehlen. Keine fertigungstaugliche Zeichnung.</p><button class="secondary" data-nav="pdm">PDM / Zeichnungen öffnen</button></div><div class="section card"><h2>Kosten & Kalkulation</h2>'+rows.map(x=>'<div class="item"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'<p class="muted small">Ohne zusätzliche Lohn-, Gemein-, Prüf- und Versandkosten. Materialpreis ist ein Demo-Schätzwert.</p></div><div class="section card"><h2>Zuschnitt & Arbeitsplan</h2><p>50 Rohblöcke · 125 × 85 × 20 mm · Zuschnitt abgeschlossen (simuliert)</p>'+db.planning.filter(x=>x.order===DEMO).map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><div class="muted small">'+esc(x.machine)+' · '+esc(x.hours)+' h · '+esc(x.date)+'</div></div><span class="tag">'+esc(x.status)+'</span></div>').join('')+'<div class="actions" style="margin-top:12px"><button class="secondary" data-nav="planning">Arbeitsplanung</button><button class="secondary" data-nav="materials">Materiallager</button></div></div><div class="section card"><h2>Fertigungsakte</h2><p>CAM: noch zu erstellen · Qualität: Prüfung offen · Zeiterfassung: 1,5 h Demo-Zuschnitt</p><div class="actions"><button class="secondary" data-nav="cam">CAM / NC</button><button class="secondary" data-nav="quality">Prüfplan</button><button class="secondary" data-nav="time">Zeiten</button><button class="secondary" data-nav="inventory">Lagerbewegungen</button></div></div>'}
function roleBar(){return '<div class="rolebar"><label for="roleSelect" style="margin:0">Arbeitsbereich</label><select id="roleSelect" aria-label="Arbeitsbereich">'+roleNames.map(r=>'<option '+(r===activeRole?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select><button class="secondary" data-nav="all">Mehr · Alle Bereiche</button></div>'}
function clockPanel(){const elapsed=clockSession?((Date.now()-clockSession.start)/3600000).toFixed(2):null;return '<div class="card clockcard"><h2>Stempeluhr · Testbetrieb</h2><p class="muted small">Lokal auf diesem Gerät. Keine geprüfte Personalzeiterfassung.</p>'+(clockSession?'<p>Gestartet: '+esc(new Date(clockSession.start).toLocaleString('de-DE'))+' · bisher ca. '+elapsed+' h</p><button class="primary" data-clock="stop">Ausstempeln</button>':'<div class="actions"><input id="clockEmployee" placeholder="Mitarbeitername" aria-label="Mitarbeitername"><input id="clockOrder" placeholder="Auftragsnummer (optional)" aria-label="Auftragsnummer"><select id="clockType" aria-label="Zeitart"><option>Fertigen</option><option>Rüsten</option><option>Programmieren</option><option>Prüfen</option><option>Sonstiges</option></select><button class="primary" data-clock="start">Einstempeln</button></div>')+'</div>'}
function nav(){const groups=[['Übersicht',['home']],['Produktion',['orders','planning','cam','pdm','quality','time']],['Ressourcen',['materials','tools','toolassemblies','inventory','machines','maintenance']],['Betrieb',['finance','debts','purchasing','customers','suppliers','employees','knowledge','settings']]];$('sidebar').innerHTML=groups.map(([g,arr])=>'<div class="muted small" style="margin:15px 8px 6px">'+g+'</div>'+arr.filter(k=>k==='home'||roleModules[activeRole].includes(k)).map(k=>'<button class="navbtn '+(current===k?'active':'')+'" data-nav="'+k+'">'+(k==='home'?iconSvg('home',19)+' Start':iconSvg(defs[k].icon,19)+' '+defs[k].name)+'</button>').join('')).join('');$('bottom').innerHTML=[['home','home','Start'],['orders','clipboard-list','Aufträge'],['materials','package','Lager'],['time','clock','Stempeln'],['all','grid','Mehr']].map(([k,i,t])=>'<button data-nav="'+k+'" class="'+(current===k?'active':'')+'"><strong>'+iconSvg(i,23)+'</strong>'+t+'</button>').join('')}
function dashboard(){
const revenue=sum(db.orders,o=>Number(o.qty)*Number(o.price));
const cost=sum(db.orders,o=>Number(o.materialCost)+Number(o.hours)*(Number(db.machines.find(m=>m.title===o.machine)?.rate)||45));
const pending=db.orders.filter(o=>!['Fertig','Ausgeliefert','Bezahlt'].includes(o.status)).length;
const production=db.orders.filter(o=>o.status==='In Fertigung').length;
const ready=db.orders.filter(o=>o.status==='Bereit').length;
const finished=db.orders.filter(o=>['Fertig','Ausgeliefert','Bezahlt'].includes(o.status)).length;
const tracked=sum(db.time,x=>x.hours);
const stats=[['Aufträge gesamt',db.orders.length,'clipboard-list'],['Offene Aufträge',pending,'clock'],['In Fertigung',production,'factory'],['Bereit',ready,'check-circle'],['Abgeschlossen',finished,'check-circle'],['Erfasste Stunden',tracked.toFixed(1)+' h','clock'],['Auftragsvolumen',money(revenue),'wallet'],['Kalk. Deckungsbeitrag',money(revenue-cost),'chart-no-axes-column']];
return '<h1>Übersicht & Statistiken</h1><div class="grid">'+stats.map(([label,value,icon])=>'<div class="card"><div class="muted small">'+iconSvg(icon,16)+' '+label+'</div><div class="metric">'+value+'</div></div>').join('')+'</div><p class="muted small">Planungswerte aus lokalen Daten; Demoaufträge werden mitgezählt.</p><div class="section"><div class="modules">'+roleNames.map(role=>'<button class="module" data-role="'+esc(role)+'"><span class="module-icon">'+iconSvg(role==='Büro'?'wallet':role==='Lager'?'package':role==='Qualität'?'check-circle':role==='CAM'?'code':role==='Leitung'?'grid':'factory',26)+'</span><b>'+esc(role)+'</b><span class="muted small">Bereich öffnen</span></button>').join('')+'</div></div>';
}
function moduleGrid(all=false){return '<div class="modules">'+(all?keys:keys.filter(k=>roleModules[activeRole].includes(k))).map(k=>'<button class="module" data-nav="'+k+'"><span class="module-icon">'+iconSvg(defs[k].icon,26)+'</span><b>'+defs[k].name+'</b><span class="muted small">'+defs[k].description+'</span></button>').join('')+'</div>'}
function listRows(k,arr){if(!arr.length)return '<div class="empty">Noch keine Einträge. Über „+ Neuer Eintrag“ kannst du starten.</div>';return '<div class="list">'+arr.map(x=>'<div class="item"><div class="left"><b>'+esc(x.title||x.number||'Eintrag')+'</b><div class="muted small" style="margin-top:5px">'+esc(x.number||'')+' '+(x.status?'<span class="tag">'+esc(x.status)+'</span>':'')+'</div>'+(k==='orders'?'<div class="small" style="margin-top:7px">'+esc(x.qty||0)+' Stück · '+money(Number(x.qty)*Number(x.price))+' netto</div>':'')+'</div><div class="actions"><button class="secondary" data-edit="'+k+':'+x.id+'">Bearbeiten</button><button class="secondary danger" data-delete="'+k+':'+x.id+'">Löschen</button></div></div>').join('')+'</div>'}
function modulePage(k){const d=defs[k];let a=db[k].filter(x=>Object.values(x).some(v=>String(v??'').toLowerCase().includes(filter.toLowerCase())));let extra='';if(k==='materials'||k==='tools')extra='<div class="notice">Bestandswarnungen: <b>'+db[k].filter(x=>Number(x.qty)<=Number(x.min)&&x.min!==undefined).length+'</b> Artikel am oder unter Mindestbestand. Lagerbewegungen können über das eigene Modul erfasst werden.</div>';if(k==='orders')extra='<div class="notice">Auftragskalkulation: Verkaufspreis × Menge minus Materialkosten und kalkulierte Maschinenstunden. Weitere Kosten und Steuern sind noch nicht enthalten.</div>';return '<div class="topline"><div><div class="muted small">CNC OS / '+esc(d.name)+'</div><h1>'+d.icon+' '+d.name+'</h1><p class="muted">'+d.description+'</p></div><button class="primary" data-new="'+k+'">+ Neuer Eintrag</button></div>'+extra+'<div class="section"><input id="search" class="search" placeholder="Einträge suchen …" value="'+esc(filter)+'" aria-label="Einträge suchen"><span class="muted small" style="margin-left:10px">'+a.length+' Einträge</span></div>'+listRows(k,a)}
function render(){nav();$('app').innerHTML=(current==='home'?'':roleBar())+(current==='demo'?demoPage():current==='home'?dashboard()+clockPanel():current==='role'?'<h1>'+esc(activeRole)+'</h1><p class="muted">Module für diesen Arbeitsbereich</p>'+clockPanel()+moduleGrid():current==='all'?'<h1>Alle Module</h1><p class="muted">Alle Funktionen bleiben für den Test erreichbar. Dies ist keine Zugriffsbeschränkung.</p>'+moduleGrid(true)+'<div class="section"><button class="secondary" data-export="1">Backup exportieren</button> <button class="secondary" data-import="1">Backup importieren</button><input type="file" id="importFile" accept="application/json" hidden></div>':modulePage(current))}
function showForm(k,id){const d=defs[k],x=id?db[k].find(z=>z.id===id):null;editing={k,id:id||null};$('modalTitle').textContent=(x?'Bearbeiten: ':'Neu: ')+d.name;$('fields').innerHTML=d.fields.map(([key,label,type,opts])=>'<div class="'+(type==='textarea'?'wide':'')+'"><label for="f_'+key+'">'+label+'</label>'+(type==='select'?'<select id="f_'+key+'" name="'+key+'">'+opts.split('|').map(v=>'<option '+(x&&x[key]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="f_'+key+'" name="'+key+'">'+esc(x?.[key]||'')+'</textarea>':'<input id="f_'+key+'" name="'+key+'" type="'+(type||'text')+'" '+(type==='number'?'step="any"':'')+' value="'+esc(x?.[key]??'')+'">')+'</div>').join('');$('modal').showModal()}
$('closeModal').onclick=()=>$('modal').close();$('entryForm').onsubmit=e=>{e.preventDefault();if(!editing)return;const {k,id}=editing;const data={id:id||('id'+Date.now()+Math.random().toString(36).slice(2))};for(const [key,,type] of defs[k].fields){const el=$('entryForm').elements.namedItem(key);data[key]=type==='number'?Number(el.value)||0:el.value.trim()}if(!data.title&&!data.number){alert('Bitte mindestens eine Bezeichnung oder Nummer eingeben.');return}if(id){const i=db[k].findIndex(x=>x.id===id);if(i>=0)db[k][i]=data}else db[k].push(data);save();$('modal').close();filter='';render();toast('Gespeichert')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){activeRole=b.dataset.role;localStorage.setItem('cncos_role',activeRole);current='role';render();return}if(b.dataset.demo){seedDemo();return}if(b.dataset.clock){if(b.dataset.clock==='start'){const employee=($('clockEmployee')?.value||'').trim();if(!employee){alert('Bitte Mitarbeitername eingeben');return}clockSession={employee,order:($('clockOrder')?.value||'').trim(),type:$('clockType').value,start:Date.now()};localStorage.setItem('cncos_clock',JSON.stringify(clockSession));render();toast('Eingestempelt')}else if(clockSession){const h=Math.max(0,(Date.now()-clockSession.start)/3600000);db.time.push({id:'id'+Date.now(),number:'ZE-'+Date.now(),title:'Stempelzeit '+clockSession.type,employee:clockSession.employee,order:clockSession.order,hours:Number(h.toFixed(4)),date:new Date().toISOString().slice(0,10),type:clockSession.type});save();clockSession=null;localStorage.removeItem('cncos_clock');render();toast('Zeit gespeichert')}return}if(b.dataset.nav){current=b.dataset.nav;filter='';render();scrollTo(0,0)}else if(b.dataset.new)showForm(b.dataset.new);else if(b.dataset.edit){const [k,id]=b.dataset.edit.split(':');showForm(k,id)}else if(b.dataset.delete){const [k,id]=b.dataset.delete.split(':');if(confirm('Eintrag wirklich löschen?')){db[k]=db[k].filter(x=>x.id!==id);save();render();toast('Gelöscht')}}else if(b.dataset.export){const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CNC_OS_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.dataset.import){$('importFile').click()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;const caret=e.target.selectionStart;render();const s=$('search');s.focus();s.setSelectionRange(caret,caret)}});document.addEventListener('change',async e=>{if(e.target.id==='roleSelect'){activeRole=e.target.value;localStorage.setItem('cncos_role',activeRole);current='home';render();return}if(e.target.id==='importFile'&&e.target.files[0]){try{const raw=JSON.parse(await e.target.files[0].text());const data=raw.data||raw;if(!data||typeof data!=='object'||!Array.isArray(data.orders)){throw Error('Ungültiges Backup')}if(confirm('Aktuelle Daten durch das Backup ersetzen?')){keys.forEach(k=>db[k]=Array.isArray(data[k])?data[k]:[]);save();render();toast('Backup importiert')}}catch(err){alert('Backup konnte nicht importiert werden: '+err.message)}}});
render();
})();</script></body></html>
