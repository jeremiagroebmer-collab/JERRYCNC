async function storeOrderFile(id,file){
if(file.size>15*1024*1024){alert('Maximal 15 MB pro Datei.');return}
const ext=file.name.split('.').pop().toLowerCase();
if(!['pdf','png','jpg','jpeg','webp','step','stp','stl'].includes(ext)){alert('Erlaubt: PDF, Bild, STEP, STL');return}
try{const dbfile=await localFileDB();const key='doc-'+Date.now()+'-'+Math.random().toString(36).slice(2);
await new Promise((res,rej)=>{const tx=dbfile.transaction('documents','readwrite');tx.objectStore('documents').put({id:key,name:file.name,blob:file,type:file.type});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
const o=db.orders.find(v=>v.id===id);if(!o)return;
if(!Array.isArray(o.documents))o.documents=[];o.documents.push({id:key,name:file.name,date:new Date().toISOString()});
save();render();toast('Datei lokal gespeichert');
}catch(e){alert('Datei konnte nicht gespeichert werden: '+e.message)}
}
async function openOrderFile(id){
try{const d=await localFileDB();const doc=await new Promise((res,rej)=>{const tx=d.transaction('documents');const req=tx.objectStore('documents').get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});

function quoteCalc(o){
const mat=db.materials.find(x=>x.id===o.quoteMaterialId),machine=db.machines.find(x=>x.id===o.quoteMachineId),q=Number(o.qty)||0,need=Number(o.quoteMaterialQty)||0,h=Number(o.quoteHours)||0;
const rawRate=machine?(machineRate(machine)??(knownNumber(machine.rate)&&Number(machine.rate)>=0?Number(machine.rate):null)):null;
const matPrice=mat&&knownNumber(mat.cost)&&Number(mat.cost)>=0?Number(mat.cost):null;
const matCost=mat&&knownNumber(o.quoteMaterialQty)&&need>=0&&matPrice!==null?matPrice*need:null;
const mc=machine&&knownNumber(o.quoteHours)&&h>=0&&rawRate!==null?rawRate*h:null;
const tools=(Array.isArray(o.quoteTools)?o.quoteTools:[]).map(t=>{const x=db.tools.find(v=>v.id===t.id),qty=Number(t.qty)||0,unit=x&&knownNumber(x.cost)&&Number(x.cost)>=0?Number(x.cost):null;return {id:t.id,x,qty,unit,cost:unit===null?null:unit*qty}});
const toolCost=tools.every(t=>t.cost!==null&&t.qty>0)?tools.reduce((n,t)=>n+t.cost,0):null;
const stock=mat&&knownNumber(mat.qty)?Number(mat.qty):null,reserved=mat?Number(mat.reserved)||0:0;
const ownReserved=(o.reservations||[]).filter(x=>x.materialId===mat?.id).reduce((n,x)=>n+Number(x.qty||0),0);
const consumed=mat?sum(db.inventory.filter(x=>x.order===o.number&&x.type==='Entnahme'&&(x.materialId===mat.id||x.article===(mat.number||mat.title))),x=>x.qty):0;
const free=stock===null?null:Math.max(0,stock-reserved+ownReserved),missing=free===null?null:Math.max(0,need-free-consumed);
const other=Number(o.otherCost)||0,setup=Number(o.setupHours)||0,setupCost=rawRate===null?null:setup*rawRate;
const total=matCost!==null&&mc!==null&&toolCost!==null&&setupCost!==null&&q>0?matCost+mc+toolCost+setupCost+other:null,revenue=knownNumber(o.price)&&q>0?q*Number(o.price):null;
const markup=knownNumber(o.quoteMarkup)?Number(o.quoteMarkup):20,suggested=total===null?null:Math.ceil(total/q*(1+markup/100)*100)/100;
return {mat,machine,q,need,h,rawRate,matPrice,matCost,mc,tools,toolCost,stock,reserved,ownReserved,consumed,free,missing,total,revenue,setupCost,other,markup,suggested};
}

document.addEventListener('input',e=>{if(e.target.closest('#quoteForm')){const form=e.target.closest('form'),o=db.orders.find(x=>x.id===form.dataset.order);if(!o)return;const draft=quoteDraft(form,o);$('quoteLive').innerHTML=quoteSummary(draft);$('quoteDraftNotice').hidden=false;$('quoteUnit').textContent=db.materials.find(x=>x.id===draft.quoteMaterialId)?.unit||'Lagereinheit'}});
document.addEventListener('submit',e=>{if(e.target.id==='quoteForm'){e.preventDefault();e.stopImmediatePropagation();persistQuote(e.target)}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const leaves=['nav','view','orderTab','orderShortcut','related','orderClock','globalSearch','edit','quoteRemove','quotePlan'].some(k=>b.dataset[k]!==undefined);if(leaves&&$('quoteDraftNotice')&&!$('quoteDraftNotice').hidden&&!confirm('Die Kalkulation enthält ungespeicherte Änderungen. Verwerfen und weitergehen?')){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('click',async e=>{
const b=e.target.closest('button');if(!b)return;const d=b.dataset;
const handled=['quickOrder','globalSearch','themeToggle','searchRecord','related','orderClock','release','applyPrice','quotePlan','backupFull','cloudPush','cloudPull','cloudLogin','restoreLocal','qrCopy','receive'].some(k=>d[k]!==undefined);if(!handled)return;e.preventDefault();e.stopImmediatePropagation();
try{
if(d.receive)receivePurchase(d.receive);else if(d.quickOrder)quickOrder();
else if(d.globalSearch)openGlobalSearch();
else if(d.themeToggle){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('cncos_theme',next);document.documentElement.dataset.theme=next;}
else if(d.searchRecord){const [k,...id]=d.searchRecord.split(':');$('globalSearchDialog').close();openRecord(k,id.join(':'));}
else if(d.related){const [k,...id]=d.related.split(':');startRelated(k,id.join(':'));}
else if(d.orderClock){const o=db.orders.find(x=>x.id===d.orderClock);clockOrderPrefill=o?.number||'';goTo('clock');}
else if(d.release){const [id,i]=d.release.split(':');releaseReservation(id,Number(i));}
else if(d.applyPrice){if($('quoteDraftNotice')&&!$('quoteDraftNotice').hidden){toast('Bitte zuerst die geänderte Kalkulation speichern.');return}const o=db.orders.find(x=>x.id===d.applyPrice);if(!o)return;const c=quoteCalc(o);if(c.suggested===null){toast('Kalkulation noch unvollständig. Material, Maschine, Mengen und Preise ergänzen.');return}if(knownNumber(o.price)&&!confirm('Verkaufspreis von '+money(o.price)+' auf '+money(c.suggested)+' pro Stück ändern?'))return;o.price=c.suggested;save();render();toast('Verkaufspreis übernommen.');}
else if(d.quotePlan)createPlanFromQuote(d.quotePlan);
else if(d.backupFull){workspaceBackup();render();toast('Download gestartet. Die JSON-Datei enthält keine hochgeladenen Zeichnungen.');}
else if(d.cloudPush){b.disabled=true;await workspacePush();if(current==='data')render();}
else if(d.cloudPull){b.disabled=true;await workspacePull();}
else if(d.cloudLogin)$('cloudAuth').hidden=false;
else if(d.restoreLocal){const raw=JSON.parse(localStorage.getItem('cncos_restore_point')||'null');if(!raw)throw Error('Kein Wiederherstellungspunkt vorhanden.');const restored=validateBackup(raw.data);if(!confirm('Stand vom '+new Date(raw.at).toLocaleString('de-DE')+' wiederherstellen? Der aktuelle Stand wird vorher zum Download gesichert.'))return;workspaceBackup();const prior=db;try{db=restored;save()}catch(error){db=prior;throw error}workspaceRevision=null;goTo('data');toast('Lokalen Stand wiederhergestellt.');}
else if(d.qrCopy){const o=db.orders.find(x=>x.id===d.qrCopy);if(!o)return;const url=new URL(location.href);url.hash='order-id='+encodeURIComponent(o.id);try{await navigator.clipboard.writeText(url.href);toast('Auftragslink kopiert')}catch{openAction('Auftragslink kopieren','<label>Link<input readonly value="'+esc(url.href)+'"></label><p class="muted">Link markieren und kopieren.</p>',()=>true,'Fertig')}}
}catch(error){toast(error.message||'Aktion konnte nicht abgeschlossen werden.')}finally{b.disabled=false}
},true);
document.addEventListener('change',async e=>{
if(e.target.id!=='importFile'||!e.target.files?.[0])return;e.stopImmediatePropagation();const input=e.target;
try{const file=input.files[0];if(file.size>25*1024*1024)throw Error('Sicherung ist größer als 25 MB. Bitte eine CNC-OS-JSON-Sicherung ohne eingebettete Dateien wählen.');const raw=JSON.parse(await file.text()),data=validateBackup(raw.data||raw);const count=sum(keys,k=>data[k].length);if(!confirm(count+' Datensätze aus dieser Sicherung laden? Der aktuelle lokale Stand wird ersetzt und vorher als Wiederherstellungspunkt gesichert.'))return;checkpoint();const prior=db;try{db=data;save()}catch(error){db=prior;throw error}workspaceRevision=null;goTo('data');toast('Sicherung importiert. Originaldateien bleiben separat.');}catch(error){alert('Import abgebrochen: '+error.message)}finally{input.value=''}
},true);

render();openOrderHash();window.addEventListener('hashchange',openOrderHash);
})();</script></body></html>
