function parseRecordCode(raw){const text=String(raw||'').trim();if(!text||text.length>4096)return null;let hash=text;if(!text.startsWith('#')){try{const u=new URL(text),base=new URL(location.href);if(u.origin!==base.origin||u.pathname.replace(/index\.html$/,'')!==base.pathname.replace(/index\.html$/,''))return null;hash=u.hash}catch{return null}}let doc=hash.match(/^#pdf=([^:]+):(.+)$/);try{if(doc){const kind=decodeURIComponent(doc[1]),id=decodeURIComponent(doc[2]);return pdfTypes.includes(kind)&&id?{pdfKind:kind,id}:null}}catch{return null}let m=hash.match(/^#record=([^:]+):(.+)$/);try{if(m){const k=decodeURIComponent(m[1]),id=decodeURIComponent(m[2]);return qrKinds.includes(k)&&id?{k,id}:null}m=hash.match(/^#(order-id|order)=(.+)$/);if(m)return m[1]==='order-id'?{k:'orders',id:decodeURIComponent(m[2])}:{k:'orders',number:decodeURIComponent(m[2])}}catch{}return null}

function stopScanner(){scanEpoch++;clearTimeout(scanTimer);scanTimer=null;if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null;const v=$('scanVideo');if(v){v.srcObject=null;v.hidden=true}const hint=$('scanHint');if(hint)hint.hidden=false}
async function startScanner(){stopScanner();const epoch=scanEpoch;if(typeof jsQR!=='function'){scanMessage('Scan-Bibliothek noch nicht verfügbar. Bitte Seite neu laden; der eingefügte QR-Link funktioniert auch ohne Kamera.');return}if(!navigator.mediaDevices?.getUserMedia){scanMessage('Kamera nicht verfügbar. CNC OS über HTTPS in Safari oder Chrome öffnen oder ein QR-Foto wählen.');return}scanMessage('Kamera wird angefragt …');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});if(epoch!==scanEpoch||current!=='scan'){stream.getTracks().forEach(t=>t.stop());return}scanStream=stream;const v=$('scanVideo');v.hidden=false;v.srcObject=stream;$('scanHint').hidden=true;await v.play();if(epoch!==scanEpoch)return;scanMessage('Kamera aktiv. QR-Code ins Bild halten.');scanLast='';const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});function tick(){if(epoch!==scanEpoch||current!=='scan')return;try{if(v.readyState>=2&&v.videoWidth){const scale=Math.min(1,800/v.videoWidth);canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);ctx.drawImage(v,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),code=jsQR(frame.data,frame.width,frame.height);if(code&&code.data!==scanLast){scanLast=code.data;if(resolveRecordCode(code.data))return}else if(!code)scanLast=''}}catch{scanMessage('Bild konnte nicht gelesen werden. Kamera stoppen und erneut starten oder QR-Foto verwenden.')}scanTimer=setTimeout(tick,220)}tick()}catch(error){if(epoch!==scanEpoch)return;stopScanner();scanMessage(error.name==='NotAllowedError'?'Kamerazugriff nicht erlaubt. In den Website-Einstellungen freigeben oder QR-Foto / QR-Link verwenden.':'Kamera konnte nicht gestartet werden. Prüfe, ob eine andere App sie verwendet, oder wähle ein QR-Foto.')}}
async function scanPhoto(file){stopScanner();if(!file)return;if(file.size>20*1024*1024){scanMessage('Bitte ein Bild unter 20 MB wählen.');return}if(typeof jsQR!=='function'){scanMessage('Scan-Bibliothek nicht geladen. Seite neu laden oder QR-Link einfügen.');return}const url=URL.createObjectURL(file),epoch=scanEpoch;try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});if(epoch!==scanEpoch||current!=='scan')return;const canvas=document.createElement('canvas'),scale=Math.min(1,1600/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height),code=jsQR(frame.data,frame.width,frame.height);if(code)resolveRecordCode(code.data);else scanMessage('Kein lesbarer QR-Code. Näher fotografieren, Spiegelungen vermeiden und den weißen Rand mit aufnehmen.')}catch{scanMessage('Bild nicht lesbar. Bitte JPG oder PNG verwenden.')}finally{URL.revokeObjectURL(url)}}

function validateBackup(data){if(!data||typeof data!=='object'||!Array.isArray(data.orders))throw Error('Keine gültige CNC-OS-Sicherung.');const result={};for(const k of keys){if(data[k]!==undefined&&!Array.isArray(data[k]))throw Error('Ungültiger Bereich: '+k);result[k]=data[k]||[];const ids=new Set();for(const item of result[k]){if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id||ids.has(item.id))throw Error('Ungültiger oder doppelter Datensatz in '+defs[k].name);ids.add(item.id);for(const key of [...defs[k].fields.filter(f=>f[2]==='number').map(f=>f[0]),'reserved']){const v=item[key];if(v!==undefined&&v!==null&&v!==''&&!Number.isFinite(Number(v)))throw Error('Ungültiger Zahlenwert ('+key+') in '+defs[k].name)}for(const key of ['qty','reserved']){const v=item[key];if(v!==undefined&&v!==null&&v!==''&&Number(v)<0)throw Error('Negativer Wert ('+key+') in '+defs[k].name)}if(k==='tools'){for(const key of ['cornerRadius','neckDiameter','neckLength','teeth','threadPitch','insertDepth']){const v=item[key];if(v!==undefined&&v!==null&&v!==''&&!(Number(v)>0))throw Error('Wert muss größer als 0 sein ('+key+') in '+defs[k].name)}const pa=item.pointAngle;if(pa!==undefined&&pa!==null&&pa!==''&&!(Number(pa)>0&&Number(pa)<180))throw Error('Spitzenwinkel muss zwischen 0 und 180 liegen in '+defs[k].name)}}}if(data._discipline!==undefined&&!CncDisciplines.names[data._discipline])throw Error('Unbekannte Fachrichtung in Sicherung.');if(data._discipline)result._discipline=data._discipline;if(data._disciplines!==undefined){if(!data._disciplines||typeof data._disciplines!=='object'||Array.isArray(data._disciplines))throw Error('Ungültige Fachrichtungen.');result._disciplines={};for(const [scope,rows] of Object.entries(data._disciplines)){if(!CncDisciplines.names[scope]||scope===CncDisciplines.active(result)||rows?._disciplines)throw Error('Ungültige verschachtelte Fachrichtung.');result._disciplines[scope]=validateBackup(rows)}}return result}

async function snapRestore(day){if(clockSession)throw Error('Bitte zuerst die laufende Zeiterfassung stoppen.');const rows=await CncSicherung.all(),r=rows.find(x=>x.day===day);if(!r)throw Error('Sicherung nicht gefunden.');const restored=validateBackup(JSON.parse(r.payload));if(!confirm('Stand vom '+new Date(r.at).toLocaleDateString('de-DE')+' wiederherstellen? Der aktuelle Stand wird vorher zum Download gesichert.'))return;workspaceBackup();const prior=db;try{db=restored;save()}catch(error){db=prior;throw error}workspaceRevision=null;goTo('data');toast('Sicherung vom '+new Date(r.at).toLocaleDateString('de-DE')+' wiederhergestellt.')}
function dataPage(){if(practiceMode)return '<h1>Übungsdaten</h1><p>Dieser Bestand und alle Übungsdateien liegen ausschließlich im Arbeitsspeicher. Cloud-Anmeldung, Import und Abgleich sind hier ausgeschaltet.</p>'+actionButton('Übung beenden und Daten verwerfen','practice','exit');const exported=localStorage.getItem('cncos_last_export'),saved=localStorage.getItem('cncos_last_saved'),restore=localStorage.getItem('cncos_restore_point');return '<div class="page-head"><div><div class="eyebrow">DEINE DATEN, KLAR ORGANISIERT</div><h1>Sicherung & Cloud</h1><p class="notice">Sicherung und Cloud enthalten CNC-Fertigung und 3D-Druck gemeinsam, einschließlich verkleinerter Artikel- und Bereichsfotos. Lokale Datei-Anhänge bleiben separat.</p><p class="muted">Du siehst jederzeit, wo deine Daten liegen und was gesichert ist.</p></div></div><div class="dashboard-columns"><section class="card"><span class="tag">DIESES GERÄT</span><h2>Lokaler Arbeitsstand</h2><p>Änderungen werden im Browser gespeichert. Löschen der Browserdaten entfernt diesen Arbeitsstand.</p><div class="cost-lines"><div><span>Datensätze</span><b>'+sum(keys,k=>db[k].length)+'</b></div><div><span>Zuletzt gespeichert</span><b>'+esc(saved?new Date(saved).toLocaleString('de-DE'):'Noch keine Änderung')+'</b></div><div><span>Letzter Export gestartet</span><b>'+esc(exported?new Date(exported).toLocaleString('de-DE'):'Noch kein Export')+'</b></div></div><div class="stack-actions">'+actionButton('Sicherung herunterladen','backup-full','1',true)+actionButton('Sicherung importieren','import','1')+'</div><input type="file" id="importFile" accept="application/json" hidden><p class="muted small">JSON-Sicherung enthält alle erfassten Datensätze und Dateiverweise. Hochgeladene PDF-/CAD-Dateien sind nicht enthalten: Originaldateien separat aufbewahren.</p>'+'<details open><summary>Automatische Sicherungen (letzte 7 Tage)</summary><div id="autoBackups"><p class="muted">Wird geladen …</p></div><p class="muted small">Einmal pro Tag legt die App beim Öffnen eine Kopie an. Sie liegt wie alles andere im Browser. Ladet deshalb zusätzlich regelmäßig eine Sicherung herunter oder speichert in die Cloud.</p></details>'+(restore?'<details><summary>Letzten lokalen Stand wiederherstellen</summary><p>Bei jeder Änderung wird die davor gültige Version gesichert (immer nur die letzte).</p>'+actionButton('Wiederherstellungspunkt laden','restore-local','1')+'</details>':'')+'</section><section class="card"><span class="tag">GERÄTEWECHSEL</span><h2>Cloud-Abgleich</h2><p>Auf Gerät A speichern, auf Gerät B laden. Es gibt keine automatische Hintergrund-Synchronisierung.</p><div class="notice">'+(cloudUser?'Angemeldet als '+esc(cloudUser.email)+' · Cloud-Version '+esc(workspaceRevision??'noch nicht geladen'):'Nicht angemeldet. Lokale Daten können ohne Anmeldung verwendet werden.')+'</div><div class="stack-actions">'+(cloudUser?actionButton('Diesen Stand in Cloud speichern','cloud-push','1',true)+actionButton('Cloud-Stand auf dieses Gerät laden','cloud-pull','1'):actionButton('Für Cloud anmelden','cloud-login','1',true))+'</div><p class="muted small">Beim ersten Laden werden lokale Daten ersetzt; vorher wird eine Sicherung erstellt. Bei gleichzeitigen Änderungen auf mehreren Geräten verhindert die Versionsprüfung ein unbemerktes Überschreiben.</p></section></div><section class="card"><h2>So wechselst du sicher das Gerät</h2><ol class="help-steps"><li>Arbeit abschließen und eine Sicherung herunterladen.</li><li>Auf dem aktuellen Gerät „Diesen Stand in Cloud speichern“ wählen.</li><li>Auf dem anderen Gerät anmelden und „Cloud-Stand auf dieses Gerät laden“ wählen.</li><li>Zeichnungen über einen HTTPS-Link teilen oder die Originaldateien auf dem zweiten Gerät hinterlegen.</li></ol><p class="muted">Cloud-Meldungen zeigen, ob der Server bereit ist. Die App allein bestätigt keine erfolgreiche Serversicherung.</p></section>'}
function searchEverywhere(query){const q=query.trim().toLocaleLowerCase('de');const matches=q?keys.flatMap(k=>db[k].filter(x=>k==='tools'?CncTooling.search(x,q):[x.title,x.number,x.customer,x.order,x.material,x.machine].some(v=>String(v||'').toLocaleLowerCase('de').includes(q))).map(x=>({k,x}))).slice(0,30):[];return q?(matches.length?matches.map(({k,x})=>'<button class="search-result" data-search-record="'+k+':'+esc(x.id)+'"><span class="module-icon">'+iconSvg(defs[k].icon,20)+'</span><span><b>'+esc(x.title||x.number)+'</b><small>'+esc(defs[k].name)+' · '+esc(x.number||'')+'</small></span>'+iconSvg('chevron-right',17)+'</button>').join(''):emptyState('Nichts gefunden','Versuche eine Auftragsnummer, einen Kunden oder ein Material.')):'<p class="muted">Aufträge, Kunden, Material, Werkzeuge und Maschinen gleichzeitig durchsuchen.</p>'}

function assemblySimplePage(a){const c=CncTooling.chain(db,a);return '<button class="backbtn" data-nav="toolassemblies">← Komplettwerkzeuge</button><div class="page-head"><div><small>'+esc(a.number)+'</small><h1>'+esc(a.title)+'</h1><p>Bezeichnung automatisch aus den Komponenten · jederzeit änderbar</p></div>'+actionButton('Name & Messwerte bearbeiten','edit','toolassemblies:'+a.id)+'</div><section class="card"><label>Für welche Maschine?<select id="assemblyMachine" data-assembly="'+esc(a.id)+'"><option value="">Maschine wählen</option>'+db.machines.map(m=>'<option value="'+esc(m.id)+'" '+(c.machine?.id===m.id?'selected':'')+'>'+esc(m.title+' · '+(m.spindle||'Anschluss fehlt'))+'</option>').join('')+'</select></label><p class="notice">'+esc(c.reason)+'</p>'+(typeof CncToolArt!=='undefined'?'<div class="stack-box"><h2>So sieht dein Werkzeug aus</h2>'+CncToolArt.stack(db,a,CncTooling)+'</div>':'')+(typeof CncTool3D!=='undefined'&&c.rows.some(r=>r.part)?'<div class="stack-box"><h2>Zeichnung und 3D</h2><p class="muted small">Tippe ein Maß an, dann leuchtet es auf. Im 3D drehst du mit dem Finger.</p>'+CncTool3D.panelHtml({asm:a.id})+(c.complete?'<label class="stickout">Auspannlänge (mm)<input type="number" min="0" step="0.5" inputmode="decimal" data-stickout="'+esc(a.id)+'" value="'+esc(a.stickout||'')+'" placeholder="'+esc(CncTooling.length(db,{...a,stickout:''}).known?'wie am Werkzeug':'z. B. 45')+'"></label><p class="muted small">So weit steht das Werkzeug aus der Spannzange. Leer lassen = Maß vom Werkzeug. Die Gesamtlänge rechnet mit.</p>':'')+'</div>':'')+'<h2>Dein Zusammenbau</h2><div class="assembly-chain">'+tmsParts(a).map((p,i)=>'<div><small>Komponente '+(i+1)+'</small><h3>'+esc(tmsPartName(p.id))+'</h3><span>'+p.qty+' Stück</span>'+actionButton('Entfernen','tms-remove',a.id+':'+p.id)+'</div>').join('')+(!tmsParts(a).length?'<p>Starte mit der Aufnahme. Danach folgen passende Verlängerungen, Spannmittel und das Schneidwerkzeug.</p>':'')+'</div>'+assemblyPicker(a)+'</section><div class="actions">'+actionButton('Zur Werkzeugliste hinzufügen','assembly-assign',a.id,true)+actionButton('Automatischen Namen verwenden','assembly-name',a.id)+'</div>'+'<details class="card"><summary>Eigenes Bild</summary>'+visualPanel('toolassemblies',a)+'</details>'+recordDocuments('toolassemblies',a)+recordQrPanel('toolassemblies',a)+'<details class="card"><summary>Länge & technische Prüfung</summary><p>Berechneter montierter Längenbeitrag: '+esc(a.calculatedLength===null||a.calculatedLength===undefined?'Nicht vollständig bekannt':numberDE(a.calculatedLength)+' mm')+'</p><p class="muted">Kompatibilität basiert auf den erfassten Anschlüssen. Herstellergrenzen und Vermessung weiterhin prüfen.</p></details>'}
function assemblyStockCards(){const a=currentAssembly();if(!a)return '';const q=$('componentQuery')?.value||'',show=$('showIncompatible')?.checked;const items=db.tools.filter(p=>CncStock.group(p)!=='general'&&CncTooling.search(p,q)).map(p=>({p,fit:CncTooling.candidate(db,a,p)}));return '<h3>Aus deinem Bestand</h3><p class="muted small">Antippen fügt ein passendes Teil direkt hinzu. Menge aus dem Mengenfeld; Standard ist 1.</p><div class="assembly-stock">'+items.filter(({fit})=>fit.ok||show||!cHasMachine(a)).map(({p,fit})=>'<button type="button" class="secondary" data-assembly-part="'+esc(p.id)+'" '+(!fit.ok?'disabled':'')+'>'+thumbnail('tools',p)+'<b>'+esc(p.title)+'</b><small>'+esc(p.number)+' · frei: '+esc(tmsFree(p)??'unbekannt')+'</small><small>'+esc(fit.ok?'Hinzufügen':fit.reason)+'</small></button>').join('')+'</div>'+(CncTooling.chain(db,a).complete?'<p class="notice">Zusammenbau vollständig. Jetzt Messwerte ergänzen oder zur Werkzeugliste hinzufügen.</p>':!items.some(x=>x.fit.ok)?'<p class="notice">Noch keine passenden Komponenten. Maschine wählen oder „Auch nicht passende zeigen“ aktivieren, um den Grund zu sehen.</p>':'')}
function cHasMachine(a){return !!CncTooling.machineFor(db,a)}
function assemblyDirectAdd(id){const a=currentAssembly(),qty=Number($('tmsAddForm')?.elements.qty.value||1);wfTransaction(()=>addAssemblyComponent(a,id,qty));toast('Komponente eingefügt · Name und Bestand aktualisiert.');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b?.dataset.assemblyPart)return;e.preventDefault();try{assemblyDirectAdd(b.dataset.assemblyPart)}catch(err){toast(err.message)}});


function wfEditTime(id){const t=db.time.find(t=>t.id===id);openAction('Zeitbuchung korrigieren','<p>'+esc(t.title)+' · '+money(t.hourlyRate)+' / h gespeicherter Satz</p><label>Stunden<input name="hours" type="number" min="0" step="any" required value="'+esc(t.hours)+'"></label><label>Name<input name="employee" required value="'+esc(t.employee)+'"></label>',form=>{const h=Number(form.elements.hours.value);if(!CncWorkflow.known(h)||!CncWorkflow.known(t.hourlyRate))throw Error('Gültige Zeit und gespeicherter Kostensatz erforderlich.');wfTransaction(()=>{t.hours=h;t.costAmount=h*Number(t.hourlyRate);t.employee=form.elements.employee.value});return true},'Zeit und Kosten korrigieren');}
function wfAnalytics(rows){const results=rows.filter(o=>o.workflowVersion&&o.offerSnapshot).map(o=>({o,a:CncWorkflow.actual(db,o)})),complete=results.filter(x=>x.a.total!==null);return '<section class="card"><h2>Nachkalkulation abgeschlossener Aufträge</h2><div class="compact-stats">'+statMetric('Vollständig vergleichbar',complete.length+' / '+results.length)+statMetric('Angebotswert',money(sum(complete,x=>x.o.offerSnapshot.revenue)))+statMetric('Ist-Kosten',money(sum(complete,x=>x.a.total)))+statMetric('Ergebnis netto',money(sum(complete,x=>x.o.offerSnapshot.revenue-x.a.total)))+'</div>'+statBars(complete.map(x=>[x.o.number+' · Ist-Kosten',Math.round(x.a.total*100)/100]))+'<p class="muted small">Nur vollständig nachkalkulierte Aufträge im gewählten Filter. Ergebnis vor Steuern und vor Kosten, die nicht in Sätzen oder Zusatzkosten erfasst sind.</p></section>'}

// Guided order workflow: one persistent plan from estimate through dispatch.
function wfHistory(o,status){o.history=o.history||[];o.history.push({status,at:new Date().toISOString()})}
function wfSteps(o){return CncWorkflow.steps(db,o)}
function wfTransaction(fn){const before=structuredClone(db);try{fn();save()}catch(e){db=before;throw e}render()}
function wfButton(label,action,id,primary=false){return actionButton(label,'wf',action+':'+id,primary)}
function wfNext(o){if(['Abgelehnt','Storniert'].includes(o.status))return ['Auftrag geschlossen','overview'];if(!o.offerSnapshot)return [wfSteps(o).length?'Kalkulation prüfen und Angebot festhalten':'Groben Arbeitsplan erstellen',wfSteps(o).length?'quote':'plan'];if(!o.acceptedAt)return ['Kundenantwort ausstehend','overview'];if(!o.productionReleased)return ['Detaillierten Arbeitsplan prüfen und freigeben','plan'];if(o.status==='Ausgeliefert')return ['Versand abgeschlossen · Nachkalkulation prüfen','cost'];return ['Bereite Arbeitsgänge bearbeiten','steps']}
function wfOverview(o){const [title,tab]=wfNext(o),c=quoteCalc(o);return '<section class="card next-action"><div><span class="eyebrow">NÄCHSTER SCHRITT</span><h2>'+esc(title)+'</h2><p>'+esc(o.number)+' · '+esc(o.customer||'Kunde offen')+' · '+esc(o.qty)+' Stück</p></div><div class="actions">'+(tab!=='overview'?actionButton('Hier weiter','order-tab',tab,true):'')+(!o.acceptedAt&&o.offerSnapshot&&!['Abgelehnt','Storniert'].includes(o.status)?wfButton('Kunde hat angenommen','accept',o.id,true)+wfButton('Nicht angenommen','reject',o.id):'')+'</div></section><section class="card"><h2>Ein Auftrag · ein Arbeitsplan</h2><p>Zeichnung → grober Arbeitsplan → Kalkulation & Angebot → Kundenfreigabe → Plan verfeinern → Fertigung → Verpacken → Versand.</p><div class="compact-stats">'+statMetric('Arbeitsgänge',wfSteps(o).length)+statMetric('Aktuelle Plankosten',c.total===null?'Offen':money(c.total))+statMetric('Angebot gesamt',o.offerSnapshot?money(o.offerSnapshot.revenue):'Noch nicht festgehalten')+'</div>'+actionButton('Zeichnung & Dateien','order-tab','drawing')+actionButton('Arbeitsplan öffnen','order-tab','plan')+'</section>'}
function wfPlan(o){const list=wfSteps(o),estimate=CncWorkflow.estimate(db,o,machineRate);return '<section class="card"><div class="section-title"><div><span class="eyebrow">'+(o.acceptedAt?'FERTIGUNG VORBEREITEN':'ANGEBOT VORBEREITEN')+'</span><h2>'+(o.acceptedAt?'Detaillierter Arbeitsplan':'Grober Arbeitsplan')+'</h2></div>'+wfButton('+ Arbeitsschritt','add',o.id,true)+'</div><p>Rüstzeit einmal je Los, Stückzeit × '+esc(o.qty)+' Teile. Für CAM, manuelle Programmierung oder Verpacken kannst du eine Gesamtzeit wählen.</p>'+(!list.length?'<p class="notice">Schnell starten: Eine Vorlage anlegen und anschließend deine Maschinen und Zeiten eintragen.</p>'+wfButton('Sägen → CAM → Fräsen → Prüfen → Verpacken → Versand','template',o.id):'')+list.map((p,i)=>wfStepCard(o,p,i)).join('')+'<div class="cost-total"><span>'+numberDE(estimate.hours)+' h geplant · Arbeitsgangkosten</span><b>'+esc(estimate.total===null?'Sätze / Zeiten fehlen':money(estimate.total))+'</b></div><div class="actions">'+(!o.acceptedAt?actionButton('Weiter zur Kalkulation','order-tab','quote',true):!o.productionReleased?wfButton('Plan freigeben → Fertigung','release',o.id,true):'')+pdfAction('Arbeitsplan-PDF','workplan',o.id)+'</div><p class="muted small">Vorgänger legen fest, worauf ein Schritt wartet. Ohne Vorgänger kann er parallel starten. Eine Planänderung nach Freigabe erfordert eine erneute Freigabe.</p></section>'}
function wfStepCard(o,p,i){const state=CncWorkflow.state(db,o,p),h=CncWorkflow.hours(p,o),programs=CncWorkflow.programIds(db,o,p);return '<article class="wf-step"><div class="section-title"><div><small>'+String(i+1).padStart(2,'0')+' · '+esc(p.machine||p.kind||'Arbeitsplatz')+'</small><h3>'+esc(p.title)+'</h3></div>'+badge(state)+'</div><p>'+esc(h===null?'Zeit offen':numberDE(h)+' h')+' · '+esc((p.dependsOn||[]).length?'Nach: '+(p.dependsOn||[]).map(id=>wfSteps(o).find(x=>x.id===id)?.title||'Vorgänger fehlt').join(', '):'Kann unabhängig starten')+'</p>'+(p.notes?'<p>'+esc(p.notes)+'</p>':'')+'<div class="actions">'+wfButton('Bearbeiten','editstep',p.id)+actionButton('Werkzeuge & Unterlagen','step-links',p.id)+wfButton('+ NC-Programm','program',p.id)+programs.map(id=>{const c=db.cam.find(x=>x.id===id);return c?actionButton('NC: '+esc(c.number||c.title),'view','cam:'+id):'<span class="notice">Programm fehlt</span>'}).join('')+(o.productionReleased&&['Zu erledigen','Läuft'].includes(state)?wfButton('Zeit starten','start',p.id,true)+wfButton('Zeit nachtragen','book',p.id)+wfButton('Arbeitsgang fertig','finish',p.id):'')+'</div></article>'}
function wfStepForm(o,p){if(o.productionReleased&&clockSession&&wfSteps(o).some(x=>x.id===clockSession.stepId))throw Error('Laufende Zeit dieses Auftrags zuerst stoppen.');if(p&&clockSession?.stepId===p.id)throw Error('Laufende Zeit zuerst stoppen.');const list=wfSteps(o),idx=p?list.findIndex(x=>x.id===p.id):list.length;const types=['Sägen','CAM-Programmierung','Manuell programmieren','Fräsen','Drehen','Bohren','Schleifen','Entgraten','Prüfen','Verpacken','Versand','3D-Druck','Sonstiges'];const num=(name,label,val,required=false)=>'<label>'+label+'<input name="'+name+'" type="number" min="0" step="any" '+(required?'required':'')+' value="'+esc(val??'')+'"></label>';openAction(p?'Arbeitsschritt bearbeiten':'Arbeitsschritt hinzufügen','<div class="formgrid"><label>Arbeitsschritt *<input name="title" required value="'+esc(p?.title||'')+'" placeholder="z. B. Sägen, CAM programmieren, Haas fräsen"></label><label>Art<select name="kind">'+types.map(t=>'<option '+(p?.kind===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label>Maschine / Arbeitsplatz<select name="machineId"><option value="">Manueller Arbeitsplatz / Büro</option>'+db.machines.map(m=>'<option value="'+esc(m.id)+'" '+(p?.machineId===m.id?'selected':'')+'>'+esc(m.title)+'</option>').join('')+'</select></label><label>Zeit gilt<select name="timeBasis"><option value="" '+(p&&p.timeBasis?'':'selected')+'>Bitte wählen</option><option value="piece" '+(p?.timeBasis==='piece'?'selected':'')+'>Pro Stück</option><option value="lot" '+(p?.timeBasis==='lot'?'selected':'')+'>Für das gesamte Los</option></select></label>'+num('setupMin','Rüsten / Vorbereiten (Minuten) *',p?.setupMin??0,true)+num('runMin','Bearbeitungszeit (Minuten) *',p?.runMin,true)+num('waitHours','Wartezeit danach (Stunden, z. B. Härten, Trocknen)',p?.waitHours)+'</div><details class="form-more" open><summary>Kostensatz</summary><p class="muted small">Leer = Satz aus Maschine. Bei manuellen Arbeitsplätzen einen Satz eingeben. Standard: Gesamtsatz inklusive Bedienung, ohne zusätzliche Personalbuchung.</p><div class="formgrid">'+num('rateOverride','Satz überschreiben (€/h)',p?.rateOverride)+'</div><details class="form-more"><summary>Maschine und Bedienung getrennt · optional</summary><div class="formgrid"><label>Abrechnung<select name="pricingMode"><option value="combined">Gesamtsatz inklusive Bedienung</option><option value="split" '+(p?.pricingMode==='split'?'selected':'')+'>Maschine und Bedienung getrennt</option></select></label>'+num('laborMin','Nur getrennt: Bedienzeit gesamt (Minuten)',p?.laborMin)+num('laborRate','Nur getrennt: Personal (€/h)',p?.laborRate)+'</div><p class="muted small">Bei getrennter Abrechnung muss ein überschreibender oder direkt hinterlegter Maschinensatz ohne Personal sein. Beim vollständigen Kostenmodell wird der Bedieneranteil automatisch herausgerechnet.</p></details></details><details class="form-more" open><summary>Wartet auf diese Vorarbeiten</summary><div class="wf-checks">'+list.filter(x=>x.id!==p?.id).map(x=>'<label><input type="checkbox" name="depends" value="'+esc(x.id)+'" '+((p?.dependsOn||[]).includes(x.id)?'checked':'')+'>'+esc(x.title)+'</label>').join('')+'</div><p class="muted small">Nichts auswählen = parallel möglich. Bei der Fräse z. B. Sägen und Programmierung auswählen.</p></details><details class="form-more"><summary>Programme & Fertigungsdetails</summary><label><input name="requiresProgram" type="checkbox" '+(p?.requiresProgram?'checked':'')+'> NC-Freigabe vor Maschinenstart erforderlich</label><div class="wf-checks">'+db.cam.filter(c=>c.order===o.number).map(c=>'<label><input type="checkbox" name="program" value="'+esc(c.id)+'" '+(p?.programIds?.includes(c.id)?'checked':'')+'>'+esc(c.number+' · '+c.title)+'</label>').join('')+'</div><label>Hinweise / Aufspannung<textarea name="notes">'+esc(p?.notes||'')+'</textarea></label></details>',form=>{const f=new FormData(form),n=k=>f.get(k)===''?null:Number(f.get(k)),m=db.machines.find(m=>m.id===f.get('machineId'));const value={...p,id:p?.id||recordId('step'),number:p?.number||nextRecordNumber('planning'),order:o.number,orderId:o.id,title:String(f.get('title')).trim(),kind:f.get('kind'),machineId:m?.id||'',machine:m?.title||f.get('kind'),setupMin:n('setupMin'),runMin:n('runMin'),timeBasis:f.get('timeBasis'),waitHours:n('waitHours'),rateOverride:n('rateOverride'),pricingMode:f.get('pricingMode'),laborMin:n('laborMin'),laborRate:n('laborRate'),dependsOn:f.getAll('depends'),programIds:f.getAll('program'),requiresProgram:f.get('requiresProgram')==='on',notes:f.get('notes'),status:p?.status||'Geplant',sequence:idx,date:o.due||''};if(value.timeBasis!=='piece'&&value.timeBasis!=='lot')throw Error('Bitte wählen: Gilt die Zeit pro Stück oder für das gesamte Los?');if(!value.title)throw Error('Bezeichnung fehlt.');for(const k of ['setupMin','runMin','rateOverride','laborMin','laborRate'])if(value[k]!==null&&!CncWorkflow.known(value[k]))throw Error('Zeiten und Sätze müssen gültige, nicht negative Zahlen sein.');value.hours=CncWorkflow.hours(value,o);CncWorkflow.validate([...list.filter(x=>x.id!==value.id),value]);wfTransaction(()=>{if(p)Object.assign(p,value);else db.planning.push(value);if(o.productionReleased)o.productionReleased=false;});return true},'Schritt speichern');}
function wfCosts(o){const a=CncWorkflow.actual(db,o),c=quoteCalc(o),offer=o.offerSnapshot,fmt=v=>v===null||v===undefined?'Noch offen':money(v);return '<section class="card"><h2>Angebot, aktueller Plan und Ist</h2><div class="cost-lines">'+[['Angebotener Gesamtpreis',offer?.revenue],['Kosten beim Angebot',offer?.cost],['Aktuelle Plankosten',c.total],['Gebuchte Arbeitsgangkosten',a.work],['Vollständige Ist-Kosten',a.total],['Ergebnis: Angebot − Ist',offer&&a.total!==null?offer.revenue-a.total:null],['Kostenabweichung: Ist − Angebotsschätzung',offer&&a.total!==null?a.total-offer.cost:null]].map(([k,v])=>'<div><span>'+k+'</span><b>'+fmt(v)+'</b></div>').join('')+'</div>'+statBars([['Angebotskosten',offer?.cost||0],['Aktueller Plan',c.total||0],['Gebuchte Arbeit',a.work||0]].map(([k,v])=>[k,Math.round(v*100)/100]))+'<p class="muted small">Diagramm in €. Leere Werte sind in der Tabelle als offen markiert. Ein Ergebnis wird erst nach Abschluss aller Schritte und vollständigen Ist-Angaben ausgewiesen. Unzugeordnete Zeitbuchungen müssen einem Arbeitsgang zugeordnet werden.</p>'+wfButton('Tatsächliche Material- und Zusatzkosten','actual',o.id)+'</section>'}
function wfProduction(){const orders=db.orders.filter(o=>o.workflowVersion&&o.acceptedAt&&isOpenOrder(o));return '<section class="card"><h2>Arbeit an den Kostenstellen</h2><p>Bestätigte Aufträge erscheinen hier automatisch. Wartende Arbeitsgänge bleiben sichtbar.</p>'+orders.filter(o=>!o.productionReleased).map(o=>'<div class="notice">'+esc(o.number)+' · Detailplan noch freigeben '+actionButton('Plan prüfen','wf-open',o.id)+'</div>').join('')+[...new Set(orders.flatMap(o=>wfSteps(o).map(p=>p.machine||p.kind||'Arbeitsplatz')))].map(name=>'<details class="card" open><summary>'+esc(name)+'</summary>'+orders.flatMap(o=>wfSteps(o).filter(p=>(p.machine||p.kind||'Arbeitsplatz')===name&&p.status!=='Abgeschlossen').map((p,i)=>'<p><b>'+esc(o.number+' · '+o.title)+'</b></p>'+wfStepCard(o,p,i))).join('')+'</details>').join('')+(!orders.length?'<p>Noch keine bestätigten Aufträge.</p>':'')+'</section>'}
function wfPriority(){const rows=db.orders.filter(isOpenOrder).map(o=>({o,p:o.workflowVersion?CncWorkflow.priority(db,o,localDay()):{slack:o.due?(new Date(o.due)-new Date(localDay()))/3600000:null}})).sort((a,b)=>(a.p.slack??Infinity)-(b.p.slack??Infinity));return '<section class="card"><h2>Was jetzt zuerst?</h2><p class="muted small">Priorität nach Terminpuffer minus verbleibender längster Arbeitsfolge. Annahme: 8 Stunden pro Werktag, ohne Feiertage, Materiallieferzeit und gemeinsame Maschinenbelegung. Fehlende Planzeiten ausdrücklich prüfen.</p>'+rows.slice(0,6).map(({o,p})=>'<div>'+orderQuickRow(o)+'<p class="muted small">'+esc(o.workflowVersion?wfNext(o)[0]:'Bestehenden Auftrag prüfen')+' · '+esc(p.slack===null?'Termin oder Planzeit offen':numberDE(p.slack)+' h rechnerischer Puffer')+(o.workflowVersion?' · '+numberDE(p.hours??0)+' h längste Restfolge':'')+'</p></div>').join('')+'</section>'}
function wfBook(p){const o=db.orders.find(o=>o.id===p.orderId||o.number===p.order),r=CncWorkflow.rate(db,p,machineRate);if(['Abgelehnt','Storniert'].includes(o?.status)){toast('Auf abgelehnte oder stornierte Aufträge kann keine Zeit gebucht werden.');return}openAction('Ist-Zeit zum Arbeitsgang','<p>'+esc(p.title)+'</p><label>Zeit (Minuten)<input name="minutes" type="number" min="0" step="any" required></label><label>Zeitart<select name="channel"><option value="machine">'+(p.pricingMode==='split'?'Maschinenzeit':'Arbeitsgang inklusive Bedienung')+'</option>'+(p.pricingMode==='split'?'<option value="labor">Bedienzeit / Personal</option>':'')+'</select></label><label>Name<input name="employee" required></label>',form=>{const f=new FormData(form),h=Number(f.get('minutes'))/60,rate=f.get('channel')==='labor'?p.laborRate:r;if(!CncWorkflow.known(rate)||!Number.isFinite(h)||h<0)throw Error('Zeit oder Kostensatz fehlt.');wfTransaction(()=>db.time.push({id:recordId('time'),number:nextRecordNumber('time'),title:p.title,stepId:p.id,order:o.number,employee:f.get('employee'),hours:h,date:localDay(),type:p.kind,channel:f.get('channel'),costAmount:h*Number(rate),hourlyRate:Number(rate)}));return true},'Zeit buchen');}
function wfStart(p){const o=db.orders.find(o=>o.id===p.orderId||o.number===p.order);if(clockSession)throw Error('Es läuft bereits eine Zeitmessung. Bitte zuerst stoppen.');if(!['Zu erledigen','Läuft'].includes(CncWorkflow.state(db,o,p)))throw Error('Arbeitsgang ist noch nicht bereit.');const r=CncWorkflow.rate(db,p,machineRate);if(r===null)throw Error('Kostensatz fehlt.');openAction('Arbeitsgang stempeln','<p>'+esc(p.title)+'</p><label>Name<input name="employee" required value="'+esc(localStorage.getItem('cncos_last_employee')||'')+'"></label><label>Zeitart<select name="channel"><option value="machine">'+(p.pricingMode==='split'?'Maschine':'Arbeitsgang inklusive Bedienung')+'</option>'+(p.pricingMode==='split'?'<option value="labor">Bedienzeit / Personal</option>':'')+'</select></label>',form=>{const channel=form.elements.channel.value,rate=channel==='labor'?p.laborRate:r;if(!CncWorkflow.known(rate))throw Error('Personalsatz fehlt.');wfTransaction(()=>{p.status='Läuft'});clockSession={employee:form.elements.employee.value,order:o.number,type:p.title,start:Date.now(),stepId:p.id,channel,hourlyRate:Number(rate)};localStorage.setItem('cncos_clock',JSON.stringify(clockSession));goTo('clock');return true},'Zeit starten');}
function wfTemplate(o){if(wfSteps(o).length)throw Error('Vorlage nur für einen leeren Plan verwenden.');wfTransaction(()=>{const names=['Sägen','CAM-Programmierung','Fräsen','Prüfen','Verpacken','Versand'],ids=names.map(()=>recordId('step'));names.forEach((title,i)=>db.planning.push({id:ids[i],number:nextRecordNumber('planning'),order:o.number,orderId:o.id,title,kind:title,sequence:i,status:'Geplant',setupMin:0,runMin:null,timeBasis:i===2?'piece':'lot',pricingMode:'combined',dependsOn:i<2?[]:i===2?[ids[0],ids[1]]:[ids[i-1]],requiresProgram:i===2,date:o.due||''}));});}
function wfAction(action,id){const o=db.orders.find(o=>o.id===id),p=db.planning.find(p=>p.id===id);if(action==='program'){const order=db.orders.find(o=>o.id===p.orderId||o.number===p.order);startRelated('cam',order.id);$('f_stepId').value=p.id;return}if(action==='add')return wfStepForm(o);if(action==='editstep')return wfStepForm(db.orders.find(o=>o.id===p.orderId||o.number===p.order),p);if(action==='template')return wfTemplate(o);if(action==='book')return wfBook(p);if(action==='start')return wfStart(p);
if(action==='offer'){if(o.offerSnapshot)throw Error('Ein Angebot ist bereits festgehalten. Der ursprüngliche Preis bleibt erhalten.');if($('quoteDraftNotice')&&!$('quoteDraftNotice').hidden)throw Error('Kalkulation zuerst speichern.');const c=quoteCalc(o);if(c.total===null||c.revenue===null)throw Error('Erst alle Kosten und einen Verkaufspreis speichern.');openAction('Angebot festhalten','<p>'+money(c.revenue)+' netto gesamt · '+money(c.total)+' geschätzte Kosten.</p><p>Der Preis und die Kalkulation werden als Angebotsstand gespeichert. Du versendest das Angebot selbst. Spätere Planänderungen verändern diesen Stand nicht.</p>',()=>{wfTransaction(()=>{o.offerSnapshot={at:new Date().toISOString(),cost:c.total,revenue:c.revenue,price:o.price,qty:o.qty,steps:structuredClone(wfSteps(o))};o.status='Angebot';wfHistory(o,'Angebot festgehalten')});orderTab='overview';render();return true},'Als angeboten / offen speichern');return}

if(action==='release'){if(!isOpenOrder(o))throw Error('Auftrag ist geschlossen.');if(!o.acceptedAt)throw Error('Zuerst Kundenannahme erfassen.');const list=wfSteps(o),c=CncWorkflow.estimate(db,o,machineRate);CncWorkflow.validate(list);if(c.total===null)throw Error('Arbeitsgänge, Zeiten und Sätze vervollständigen.');if(!list.some(p=>p.kind==='Versand'))throw Error('Bitte den letzten Arbeitsschritt Versand ergänzen.');const terminal=list.filter(p=>p.kind==='Versand');if(terminal.length!==1)throw Error('Genau einen abschließenden Versandschritt vorsehen.');const ancestors=new Set();function collect(p){for(const id of p.dependsOn||[]){ancestors.add(id);collect(list.find(x=>x.id===id))}}collect(terminal[0]);if(list.some(p=>p.id!==terminal[0].id&&!ancestors.has(p.id)))throw Error('Der Versand muss über seine Vorgänger auf alle Arbeitsschritte warten.');wfTransaction(()=>{o.productionReleased=true;o.status='In Fertigung';wfHistory(o,'Arbeitsplan freigegeben');list.forEach(p=>{p.hours=CncWorkflow.hours(p,o)})});orderTab='steps';render();return}
if(action==='finish'){const order=db.orders.find(o=>o.id===p.orderId||o.number===p.order);if(clockSession?.stepId===p.id)throw Error('Zuerst stoppen und Zeit buchen.');if(!['Zu erledigen','Läuft'].includes(CncWorkflow.state(db,order,p)))throw Error('Vorgänger und Programmfreigaben zuerst abschließen.');if(!db.time.some(t=>t.stepId===p.id))throw Error('Ist-Zeit erfassen, bei kostenfreiem Schritt ausdrücklich 0 Minuten.');if(p.pricingMode==='split'&&!['machine','labor'].every(c=>db.time.some(t=>t.stepId===p.id&&t.channel===c)))throw Error('Maschinenzeit und Bedienzeit getrennt buchen, auch wenn eine davon 0 ist.');wfTransaction(()=>{p.status='Abgeschlossen';p.finishedAt=new Date().toISOString();wfHistory(order,p.title+' abgeschlossen');if(wfSteps(order).every(p=>p.status==='Abgeschlossen'))order.status='Ausgeliefert'});return}

else if(d.orderClock){const o=db.orders.find(x=>x.id===d.orderClock);if(o?.workflowVersion){openRecord('orders',o.id);orderTab='steps';render();toast('Zeit direkt am passenden Arbeitsgang starten.');return}clockOrderPrefill=o?.number||'';goTo('clock');}
else if(d.release){const [id,i]=d.release.split(':');releaseReservation(id,Number(i));}
else if(d.applyPrice){const contract=db.orders.find(x=>x.id===d.applyPrice);if(contract?.offerSnapshot){toast('Angebotspreis ist festgehalten. Planänderungen werden getrennt ausgewertet.');return}if($('quoteDraftNotice')&&!$('quoteDraftNotice').hidden){toast('Bitte zuerst die geänderte Kalkulation speichern.');return}const o=db.orders.find(x=>x.id===d.applyPrice);if(!o)return;const c=quoteCalc(o);if(c.suggested===null){toast('Kalkulation noch unvollständig. Material, Maschine, Mengen und Preise ergänzen.');return}if(knownNumber(o.price)&&!confirm('Verkaufspreis von '+money(o.price)+' auf '+money(c.suggested)+' pro Stück ändern?'))return;o.price=c.suggested;save();render();toast('Verkaufspreis übernommen.');}
else if(d.quotePlan)createPlanFromQuote(d.quotePlan);
else if(d.backupFull){workspaceBackup();render();toast('Download gestartet. Die JSON-Datei enthält keine hochgeladenen Zeichnungen.');}
else if(d.cloudPush){b.disabled=true;await workspacePush();if(current==='data')render();}
else if(d.cloudPull){b.disabled=true;await workspacePull();}
else if(d.cloudLogin)$('cloudAuth').hidden=false;
else if(d.userPick)userPick();else if(d.toolTiles)toolTiles();else if(d.toolKind!==undefined)toolTilePick(d.toolKind);else if(d.snapRestore)await snapRestore(d.snapRestore);
else if(d.restoreLocal){if(clockSession)throw Error('Bitte zuerst die laufende Zeiterfassung stoppen.');const raw=JSON.parse(localStorage.getItem('cncos_restore_point')||'null');if(!raw)throw Error('Kein Wiederherstellungspunkt vorhanden.');const restored=validateBackup(raw.data);if(!confirm('Stand vom '+new Date(raw.at).toLocaleString('de-DE')+' wiederherstellen? Der aktuelle Stand wird vorher zum Download gesichert.'))return;workspaceBackup();const prior=db;try{db=restored;save()}catch(error){db=prior;throw error}workspaceRevision=null;goTo('data');toast('Lokalen Stand wiederhergestellt.');}
else if(d.qrCopy){const o=db.orders.find(x=>x.id===d.qrCopy);if(!o)return;const url=new URL(location.href);url.searchParams.set('fachrichtung',discipline());url.hash='order-id='+encodeURIComponent(o.id);try{await navigator.clipboard.writeText(url.href);toast('Auftragslink kopiert')}catch{openAction('Auftragslink kopieren','<label>Link<input readonly value="'+esc(url.href)+'"></label><p class="muted">Link markieren und kopieren.</p>',()=>true,'Fertig')}}
}catch(error){toast(error.message||'Aktion konnte nicht abgeschlossen werden.')}finally{b.disabled=false}
},true);
document.addEventListener('change',async e=>{
if(e.target.id!=='importFile'||!e.target.files?.[0])return;e.stopImmediatePropagation();const input=e.target;
try{if(clockSession)throw Error('Bitte zuerst die laufende Zeiterfassung stoppen.');const file=input.files[0];if(file.size>25*1024*1024)throw Error('Sicherung ist größer als 25 MB. Bitte eine CNC-OS-JSON-Sicherung ohne eingebettete Dateien wählen.');const raw=JSON.parse(await file.text()),data=validateBackup(raw.data||raw);const count=[data,...Object.values(data._disciplines||{})].reduce((n,area)=>n+sum(keys,k=>area[k].length),0);if(!confirm(count+' Datensätze aus dieser Sicherung laden? Beide Fachrichtungen werden durch die Sicherung ersetzt. Der aktuelle lokale Stand wird ersetzt und vorher als Wiederherstellungspunkt gesichert.'))return;checkpoint();const prior=db;try{db=data;save()}catch(error){db=prior;throw error}workspaceRevision=null;goTo('data');toast('Sicherung importiert. Originaldateien bleiben separat.');}catch(error){notify('Import abgebrochen: '+error.message)}finally{input.value=''}
},true);


document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;try{if(d.viewDrawing)await viewLocalDrawing(d.viewDrawing);else if(d.scanStart)await startScanner();else if(d.scanStop){stopScanner();scanMessage('Kamera gestoppt.')}else if(d.scanStock){const [mode,k,...ids]=d.scanStock.split(':');stockMove(k,ids.join(':'),mode)}else if(d.recordPrint){const [k,...ids]=d.recordPrint.split(':');printRecordLabel(k,ids.join(':'))}else if(d.recordCopy){const [k,...ids]=d.recordCopy.split(':');const url=recordQrUrl(k,ids.join(':'));try{await navigator.clipboard.writeText(url);toast('Datensatzlink kopiert')}catch{openAction('Link kopieren','<label>Link<input readonly value="'+esc(url)+'"></label>',()=>true,'Fertig')}}else if(d.scanMaintenance){const m=db.machines.find(x=>x.id===d.scanMaintenance);if(m){showForm('maintenance');const input=$('f_machine');if(input)input.value=m.title}}}catch(error){toast(error.message)}});
document.addEventListener('submit',e=>{if(e.target.id==='scanCodeForm'){e.preventDefault();resolveRecordCode(e.target.elements.code.value)}if(e.target.id==='scanFindForm'){e.preventDefault();const q=e.target.elements.query.value;if(parseRecordCode(q))resolveRecordCode(q);else $('scanMatches').innerHTML=scanFind(q)}});
document.addEventListener('change',e=>{if(e.target.dataset.pdmFile&&e.target.files?.[0])storeOrderFile(e.target.dataset.pdmFile,e.target.files[0],'pdm');if(e.target.dataset.camFile&&e.target.files?.[0])storeOrderFile(e.target.dataset.camFile,e.target.files[0],'cam');if(e.target.id==='scanPhoto')scanPhoto(e.target.files?.[0])});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopScanner();scanMessage('Kamera pausiert. Zum Fortsetzen erneut starten.')}});window.addEventListener('pagehide',stopScanner);

const originalWorkspacePush=workspacePush,originalWorkspacePull=workspacePull;workspacePush=async()=>{disciplineBusy++;try{return await originalWorkspacePush()}finally{disciplineBusy--}};workspacePull=async()=>{disciplineBusy++;try{return await originalWorkspacePull()}finally{disciplineBusy--;syncDisciplineUrl()}};

const bootUrl=new URL(location.href);if(!bootUrl.hash&&bootUrl.searchParams.has('fachrichtung'))switchDiscipline(CncDisciplines.activeFromUrl(location.href),false);render();openOrderHash();syncDisciplineUrl();window.addEventListener('hashchange',openOrderHash);window.addEventListener('load',()=>{initComponentPicker();drawOrderQr();drawRecordQrs();if(current==='pdf')loadPdfPreview();schedulePdfRefresh()});
})();</script></body></html>
