<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>CNC OS · Betriebszentrale</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf0fa;background:#0b1220;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#0b1220ee;border-bottom:1px solid #24324a;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:850;letter-spacing:.5px}.brand span{color:#4fa3ff}.muted{color:#99aac3}.small{font-size:12px}.shell{max-width:1260px;margin:auto;display:grid;grid-template-columns:240px 1fr;min-height:calc(100dvh - 65px)}aside{border-right:1px solid #24324a;padding:16px;position:sticky;top:65px;height:calc(100dvh - 65px);overflow:auto}main{padding:24px;min-width:0}.navbtn{width:100%;background:none;border:0;color:#b4c2d6;padding:13px;border-radius:12px;text-align:left;margin:2px 0}.navbtn.active,.navbtn:hover{background:#1b3150;color:white}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(25px,4vw,35px);margin:6px 0}h2{font-size:19px}p{line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#131f31;border:1px solid #293a54;border-radius:18px;padding:18px;min-width:0}.metric{font-size:clamp(20px,3vw,29px);font-weight:800;margin-top:9px;overflow-wrap:anywhere}.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.module{background:#16243a;border:1px solid #2d415d;border-radius:16px;padding:17px;text-align:left;color:white;min-height:100px}.module b{display:block;margin:9px 0 4px}.module:hover{border-color:#62a8ff}.primary{background:#398bf1;color:white;border:0;padding:12px 16px;border-radius:11px;font-weight:700}.secondary{background:#22344f;color:#edf4ff;border:1px solid #405474;padding:11px 14px;border-radius:11px}.danger{color:#ff9e9e}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:16px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:#152238;border:1px solid #2a3d59;border-radius:13px;min-width:0}.item .left{min-width:0;overflow-wrap:anywhere}.tag{display:inline-block;background:#203b59;color:#9bd0ff;border-radius:99px;padding:4px 9px;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:#a8bbd3;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #405574;border-radius:10px;background:#0e1a2d;color:white;min-width:0}textarea{min-height:85px}dialog{width:min(570px,calc(100% - 24px));max-height:85dvh;overflow:auto;border:1px solid #3b5576;border-radius:18px;background:#142239;color:white;padding:22px}dialog::backdrop{background:#000b}.wide{grid-column:1/-1}.notice{background:#193047;border:1px solid #315779;padding:12px 14px;border-radius:12px;color:#b8d8f5;margin:16px 0}.bottom{display:none}.empty{text-align:center;color:#9cafc9;padding:35px 12px}.search{max-width:310px}.progress{height:9px;background:#26374e;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#4fa3ff}.section{margin-top:26px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#22543b;padding:12px 18px;border-radius:10px;z-index:30;display:none;max-width:90vw}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7cbbff;outline-offset:2px}

</style></head><body><header><div class="brand">◈ CNC <span>OS</span></div><div class="muted small">Betriebszentrale · v0.3</div></header><div class="shell"><aside id="sidebar"></aside><main id="app"><h1>CNC OS wird geladen …</h1></main></div><nav class="bottom" id="bottom"></nav><dialog id="modal"><h2 id="modalTitle">Eintrag</h2><form id="entryForm"><div class="formgrid" id="fields"></div><div class="actions" style="margin-top:20px"><button class="primary" type="submit">Speichern</button><button class="secondary" type="button" id="closeModal">Abbrechen</button></div></form></dialog><div class="toast" id="toast"></div><script>
(function(){'use strict';
const defs={orders:{name:'Aufträge',icon:'📋',description:'Angebote, Fertigungsaufträge und Status',fields:[['number','Auftragsnummer'],['title','Bezeichnung'],['customer','Kunde'],['qty','Stückzahl','number'],['price','Verkaufspreis netto/Stück (€)','number'],['materialCost','Materialkosten gesamt (€)','number'],['hours','Maschinenstunden','number'],['machine','Maschine'],['status','Status','select','Anfrage|Angebot|CAM offen|Bereit|In Fertigung|Qualitätsprüfung|Fertig|Ausgeliefert|Bezahlt']]},tools:{name:'Werkzeuge',icon:'🛠️',description:'Werkzeuge, Halter, Schneiden und Standzeit',fields:[['number','Werkzeugnummer'],['title','Bezeichnung'],['type','Typ'],['holder','Aufnahme/Halter'],['diameter','Durchmesser (mm)','number'],['life','Standzeit (min)','number'],['qty','Bestand','number'],['min','Mindestbestand','number'],['cost','Kosten je Einheit (€)','number'],['location','Lagerplatz']]},materials:{name:'Materiallager',icon:'📦',description:'Rohmaterial, Maße, Bestände und Lagerorte',fields:[['number','Artikelnummer'],['title','Material / Bezeichnung'],['grade','Werkstoffnummer'],['dimensions','Abmessungen'],['qty','Bestand','number'],['min','Mindestbestand','number'],['cost','Einstandspreis je Einheit (€)','number'],['location','Lagerplatz']]},machines:{name:'Maschinen',icon:'🏭',description:'Maschinenpark, Stundensätze und Wartung',fields:[['number','Maschinennummer'],['title','Maschinenname'],['type','Steuerung'],['rate','Kalkulationssatz (€/h)','number'],['purchase','Kaufpreis (€)','number'],['debt','Restschuld (€)','number'],['status','Status','select','Verfügbar|Produktion|Wartung|Störung']]},cam:{name:'CAM & NC-Programme',icon:'💻',description:'Programme, Revisionen, Freigaben und Dateiverweise',fields:[['number','Programmnummer'],['title','Bauteil'],['machine','Maschine'],['revision','Revision'],['file','Dateipfad / Link'],['status','Status','select','Noch zu erstellen|In Bearbeitung|Simulation|Freigabe offen|Freigegeben|Archiviert'],['notes','Hinweise','textarea']]},pdm:{name:'PDM / Teamcenter',icon:'🧩',description:'Bauteile, Zeichnungen, Stücklisten und Revisionen',fields:[['number','Bauteilnummer'],['title','Bauteilname'],['revision','Revision'],['drawing','Zeichnungsnummer'],['file','STEP / Zeichnung Dateiverweis'],['status','Freigabe','select','Entwurf|Prüfung|Freigegeben|Gesperrt'],['notes','Änderungsnotiz','textarea']]},toolassemblies:{name:'Werkzeugbaugruppen',icon:'⚙️',description:'Komplettwerkzeuge und Voreinstelldaten',fields:[['number','Baugruppennummer'],['title','Bezeichnung'],['tool','Schneidwerkzeug'],['holder','Halter'],['length','Gesamtlänge (mm)','number'],['diameter','Durchmesser (mm)','number'],['offset','Offset / Platz'],['status','Status','select','Montage offen|Vermessen|Einsatzbereit|Gesperrt']]},purchasing:{name:'Einkauf',icon:'🛒',description:'Bestellungen und Liefertermine',fields:[['number','Bestellnummer'],['title','Artikel / Leistung'],['supplier','Lieferant'],['qty','Menge','number'],['amount','Nettowert (€)','number'],['due','Liefertermin','date'],['status','Status','select','Anfrage|Bestellt|Teilgeliefert|Geliefert|Bezahlt']]},finance:{name:'Finanzen',icon:'💶',description:'Einnahmen, Ausgaben und Liquidität',fields:[['number','Belegnummer'],['title','Buchungstext'],['type','Art','select','Einnahme|Ausgabe'],['amount','Betrag netto (€)','number'],['date','Datum','date'],['category','Kategorie'],['status','Status','select','Geplant|Offen|Bezahlt']]},customers:{name:'Kunden',icon:'👥',description:'Kontakte und Kundenstamm',fields:[['number','Kundennummer'],['title','Firma / Name'],['contact','Ansprechpartner'],['email','E-Mail'],['phone','Telefon'],['notes','Notizen','textarea']]},suppliers:{name:'Lieferanten',icon:'🚚',description:'Bezugsquellen und Konditionen',fields:[['number','Lieferantennummer'],['title','Firma'],['contact','Kontakt'],['email','E-Mail'],['lead','Lieferzeit (Tage)','number'],['notes','Notizen','textarea']]},maintenance:{name:'Wartung',icon:'🔧',description:'Wartungspläne, Reparaturen und Prüfungen',fields:[['number','Vorgangsnummer'],['title','Maßnahme'],['machine','Maschine'],['due','Fälligkeit','date'],['cost','Kosten (€)','number'],['status','Status','select','Offen|Geplant|In Arbeit|Erledigt']]},quality:{name:'Qualität',icon:'✅',description:'Prüfpläne, Messmittel und Abweichungen',fields:[['number','Prüfnummer'],['title','Prüfung / Bauteil'],['order','Auftragsnummer'],['result','Ergebnis'],['status','Status','select','Offen|In Prüfung|Bestanden|Gesperrt'],['notes','Notizen','textarea']]},employees:{name:'Mitarbeiter',icon:'👷',description:'Rollen, Qualifikationen und Zuständigkeiten',fields:[['number','Personalnummer'],['title','Name'],['role','Rolle'],['hourly','Interner Stundensatz (€)','number'],['notes','Qualifikationen','textarea']]},time:{name:'Zeiterfassung',icon:'⏱️',description:'Arbeitszeit, Rüstzeit und Auftragsbezug',fields:[['number','Eintragsnummer'],['title','Tätigkeit'],['order','Auftragsnummer'],['employee','Mitarbeiter'],['hours','Stunden','number'],['date','Datum','date'],['type','Zeitart','select','Rüsten|Programmieren|Fertigen|Prüfen|Sonstiges']]},knowledge:{name:'Anleitungen',icon:'📚',description:'Wissen, Rüstanweisungen und Checklisten',fields:[['number','Dokumentnummer'],['title','Titel'],['category','Kategorie'],['revision','Version'],['notes','Anleitung / Inhalt','textarea']]},inventory:{name:'Lagerbewegungen',icon:'🔄',description:'Material- und Werkzeugzugänge/Entnahmen',fields:[['number','Buchungsnummer'],['title','Artikelbezeichnung'],['kind','Bereich','select','Materiallager|Werkzeuge'],['article','Artikelnummer'],['type','Bewegung','select','Zugang|Entnahme'],['qty','Menge','number'],['order','Auftragsnummer'],['date','Datum','date']]},debts:{name:'Finanzierung',icon:'🏦',description:'Kredite, Raten und Restschulden',fields:[['number','Vertragsnummer'],['title','Finanzierung'],['principal','Ursprünglicher Betrag (€)','number'],['balance','Aktuelle Restschuld (€)','number'],['payment','Monatliche Rate (€)','number'],['interest','Zinssatz p.a. (%)','number']]},planning:{name:'Fertigungsplanung',icon:'🗓️',description:'Maschinenbelegung, Termine und Arbeitsgänge',fields:[['number','Planungsnummer'],['title','Arbeitsgang'],['order','Auftragsnummer'],['machine','Maschine'],['date','Termin','date'],['hours','Geplante Stunden','number'],['status','Status','select','Geplant|Bereit|Läuft|Abgeschlossen']]},settings:{name:'Einstellungen',icon:'⚙️',description:'Firma, Standardsätze und Steuerannahmen',fields:[['number','Einstellungsnummer'],['title','Parameter'],['value','Wert'],['notes','Hinweise','textarea']]}};
const keys=Object.keys(defs);let db={};try{db=JSON.parse(localStorage.getItem('cncos_v03')||'{}')||{}}catch(e){db={}}keys.forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});let current='home',editing=null,filter='';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(x)||0);const sum=(a,fn)=>a.reduce((n,x)=>n+(Number(fn(x))||0),0);const save=()=>{try{localStorage.setItem('cncos_v03',JSON.stringify(db))}catch(e){alert('Speichern fehlgeschlagen. Bitte Backup exportieren.')}};function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function nav(){const groups=[['Übersicht',['home']],['Produktion',['orders','planning','cam','pdm','quality','time']],['Ressourcen',['materials','tools','toolassemblies','inventory','machines','maintenance']],['Betrieb',['finance','debts','purchasing','customers','suppliers','employees','knowledge','settings']]];$('sidebar').innerHTML=groups.map(([g,arr])=>'<div class="muted small" style="margin:15px 8px 6px">'+g+'</div>'+arr.map(k=>'<button class="navbtn '+(current===k?'active':'')+'" data-nav="'+k+'">'+(k==='home'?'⌂ Start':defs[k].icon+' '+defs[k].name)+'</button>').join('')).join('');$('bottom').innerHTML=[['home','⌂','Start'],['orders','📋','Aufträge'],['materials','📦','Lager'],['finance','💶','Finanzen'],['all','☷','Mehr']].map(([k,i,t])=>'<button data-nav="'+k+'" class="'+(current===k?'active':'')+'"><strong>'+i+'</strong>'+t+'</button>').join('')}
function dashboard(){const revenue=sum(db.orders,o=>Number(o.qty)*Number(o.price));const cost=sum(db.orders,o=>Number(o.materialCost)+Number(o.hours)*(Number(db.machines.find(m=>m.title===o.machine)?.rate)||45));const paidIn=sum(db.finance.filter(f=>f.type==='Einnahme'&&f.status==='Bezahlt'),f=>f.amount);const paidOut=sum(db.finance.filter(f=>f.type==='Ausgabe'&&f.status==='Bezahlt'),f=>f.amount);const debt=sum(db.debts,d=>d.balance)+sum(db.machines,m=>m.debt);const pending=db.orders.filter(o=>!['Fertig','Ausgeliefert','Bezahlt'].includes(o.status)).length;return '<div class="topline"><div><div class="muted small">DEINE BETRIEBSZENTRALE</div><h1>Guten Tag 👋</h1><p class="muted">Alles Wichtige für euren CNC-Betrieb an einem Ort.</p></div><button class="primary" data-new="orders">+ Neuer Auftrag</button></div><div class="grid"><div class="card"><div class="muted small">Auftragsvolumen netto</div><div class="metric">'+money(revenue)+'</div></div><div class="card"><div class="muted small">Kalk. Deckungsbeitrag</div><div class="metric">'+money(revenue-cost)+'</div></div><div class="card"><div class="muted small">Erfasster Geldfluss</div><div class="metric">'+money(paidIn-paidOut)+'</div></div><div class="card"><div class="muted small">Erfasste Restschulden</div><div class="metric">'+money(debt)+'</div></div></div><div class="notice">Die Zahlen sind Planungswerte aus euren Eingaben – keine geprüfte Buchhaltung. Offene Aufträge: <b>'+pending+'</b>. Umsatzsteuer und Gewinnsteuern sind nicht automatisch berechnet.</div><h2>Bereiche</h2>'+moduleGrid()+'<div class="section"><h2>Letzte Aufträge</h2>'+listRows('orders',db.orders.slice(-4).reverse())+'</div>'}
function moduleGrid(){return '<div class="modules">'+keys.map(k=>'<button class="module" data-nav="'+k+'"><span style="font-size:23px">'+defs[k].icon+'</span><b>'+defs[k].name+'</b><span class="muted small">'+defs[k].description+'</span></button>').join('')+'</div>'}
function listRows(k,arr){if(!arr.length)return '<div class="empty">Noch keine Einträge. Über „+ Neuer Eintrag“ kannst du starten.</div>';return '<div class="list">'+arr.map(x=>'<div class="item"><div class="left"><b>'+esc(x.title||x.number||'Eintrag')+'</b><div class="muted small" style="margin-top:5px">'+esc(x.number||'')+' '+(x.status?'<span class="tag">'+esc(x.status)+'</span>':'')+'</div>'+(k==='orders'?'<div class="small" style="margin-top:7px">'+esc(x.qty||0)+' Stück · '+money(Number(x.qty)*Number(x.price))+' netto</div>':'')+'</div><div class="actions"><button class="secondary" data-edit="'+k+':'+x.id+'">Bearbeiten</button><button class="secondary danger" data-delete="'+k+':'+x.id+'">Löschen</button></div></div>').join('')+'</div>'}
function modulePage(k){const d=defs[k];let a=db[k].filter(x=>Object.values(x).some(v=>String(v??'').toLowerCase().includes(filter.toLowerCase())));let extra='';if(k==='materials'||k==='tools')extra='<div class="notice">Bestandswarnungen: <b>'+db[k].filter(x=>Number(x.qty)<=Number(x.min)&&x.min!==undefined).length+'</b> Artikel am oder unter Mindestbestand. Lagerbewegungen können über das eigene Modul erfasst werden.</div>';if(k==='orders')extra='<div class="notice">Auftragskalkulation: Verkaufspreis × Menge minus Materialkosten und kalkulierte Maschinenstunden. Weitere Kosten und Steuern sind noch nicht enthalten.</div>';return '<div class="topline"><div><div class="muted small">CNC OS / '+esc(d.name)+'</div><h1>'+d.icon+' '+d.name+'</h1><p class="muted">'+d.description+'</p></div><button class="primary" data-new="'+k+'">+ Neuer Eintrag</button></div>'+extra+'<div class="section"><input id="search" class="search" placeholder="🔎 Einträge suchen …" value="'+esc(filter)+'" aria-label="Einträge suchen"><span class="muted small" style="margin-left:10px">'+a.length+' Einträge</span></div>'+listRows(k,a)}
function render(){nav();$('app').innerHTML=current==='home'?dashboard():current==='all'?'<h1>Alle Module</h1>'+moduleGrid()+'<div class="section"><button class="secondary" data-export="1">Backup exportieren</button> <button class="secondary" data-import="1">Backup importieren</button><input type="file" id="importFile" accept="application/json" hidden></div>':modulePage(current)}
function showForm(k,id){const d=defs[k],x=id?db[k].find(z=>z.id===id):null;editing={k,id:id||null};$('modalTitle').textContent=(x?'Bearbeiten: ':'Neu: ')+d.name;$('fields').innerHTML=d.fields.map(([key,label,type,opts])=>'<div class="'+(type==='textarea'?'wide':'')+'"><label for="f_'+key+'">'+label+'</label>'+(type==='select'?'<select id="f_'+key+'" name="'+key+'">'+opts.split('|').map(v=>'<option '+(x&&x[key]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':type==='textarea'?'<textarea id="f_'+key+'" name="'+key+'">'+esc(x?.[key]||'')+'</textarea>':'<input id="f_'+key+'" name="'+key+'" type="'+(type||'text')+'" '+(type==='number'?'step="any"':'')+' value="'+esc(x?.[key]??'')+'">')+'</div>').join('');$('modal').showModal()}
$('closeModal').onclick=()=>$('modal').close();$('entryForm').onsubmit=e=>{e.preventDefault();if(!editing)return;const {k,id}=editing;const data={id:id||('id'+Date.now()+Math.random().toString(36).slice(2))};for(const [key,,type] of defs[k].fields){const el=$('entryForm').elements.namedItem(key);data[key]=type==='number'?Number(el.value)||0:el.value.trim()}if(!data.title&&!data.number){alert('Bitte mindestens eine Bezeichnung oder Nummer eingeben.');return}if(id){const i=db[k].findIndex(x=>x.id===id);if(i>=0)db[k][i]=data}else db[k].push(data);save();$('modal').close();filter='';render();toast('Gespeichert')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){current=b.dataset.nav;filter='';render();scrollTo(0,0)}else if(b.dataset.new)showForm(b.dataset.new);else if(b.dataset.edit){const [k,id]=b.dataset.edit.split(':');showForm(k,id)}else if(b.dataset.delete){const [k,id]=b.dataset.delete.split(':');if(confirm('Eintrag wirklich löschen?')){db[k]=db[k].filter(x=>x.id!==id);save();render();toast('Gelöscht')}}else if(b.dataset.export){const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CNC_OS_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.dataset.import){$('importFile').click()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;const caret=e.target.selectionStart;render();const s=$('search');s.focus();s.setSelectionRange(caret,caret)}});document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0]){try{const raw=JSON.parse(await e.target.files[0].text());const data=raw.data||raw;if(!data||typeof data!=='object'||!Array.isArray(data.orders)){throw Error('Ungültiges Backup')}if(confirm('Aktuelle Daten durch das Backup ersetzen?')){keys.forEach(k=>db[k]=Array.isArray(data[k])?data[k]:[]);save();render();toast('Backup importiert')}}catch(err){alert('Backup konnte nicht importiert werden: '+err.message)}}});
render();
})();</script></body></html>
